# Throwaway spike (Phase 0 of design-docs/av_false_positive_plan.md).
# Answers one question: does Defender on a windows-latest runner have real-time
# protection AND a working cloud connection? Delete this workflow once the
# verdict is recorded in the plan's Phase 0 decision table.

name: Defender Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest

    steps:
      - name: Defender status and preferences
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host '=== Get-MpComputerStatus ==='
          $status = Get-MpComputerStatus
          $status | Format-List AMRunningMode, AntivirusEnabled, RealTimeProtectionEnabled,
                                IsTamperProtected, AntivirusSignatureVersion, AMEngineVersion

          Write-Host '=== Get-MpPreference ==='
          $pref = Get-MpPreference
          $pref | Format-List MAPSReporting, SubmitSamplesConsent, CloudBlockLevel,
                              DisableRealtimeMonitoring, DisableBlockAtFirstSeen

          Write-Host '=== Exclusions ==='
          Write-Host ('ExclusionPath   : ' + ($pref.ExclusionPath    -join ', '))
          Write-Host ('ExclusionProcess: ' + ($pref.ExclusionProcess -join ', '))

          $rtp = [bool]$status.RealTimeProtectionEnabled
          "RTP_ENABLED=$rtp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate MAPS (cloud) connection
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'

          # the ProgramFiles copy is a stub that forwards to the current platform build;
          # fall back to the platform folder directly if it is missing
          $exe = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if (-not (Test-Path $exe)) {
            $exe = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" |
                   Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          }
          Write-Host "MpCmdRun: $exe"

          & $exe -ValidateMapsConnection
          $code = $LASTEXITCODE
          Write-Host "ValidateMapsConnection exit code: $code"

          "MAPS_EXIT=$code" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $global:LASTEXITCODE = 0

      - name: Positive control - EICAR (proves real-time protection is active)
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'

          # assembled at run time so this workflow file is not itself a test-virus sample
          $part1 = 'X5O!P%@AP[4\PZX54(P^)7CC)7}'
          $part2 = '$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!'
          $part3 = '$H+H*'

          $path = Join-Path $env:RUNNER_TEMP 'eicar-control.txt'
          try {
            [IO.File]::WriteAllText($path, ($part1 + $part2 + $part3))
          }
          catch {
            Write-Host "write blocked: $($_.Exception.Message)"
          }

          Start-Sleep -Seconds 5
          $survived = Test-Path $path
          Write-Host "file still present: $survived"

          if ($survived) {
            Write-Host 'RESULT: EICAR survived - real-time protection is NOT scanning writes'
            Remove-Item $path -Force -ErrorAction SilentlyContinue
          }
          else {
            Write-Host 'RESULT: EICAR removed - real-time protection is active'
          }

          "EICAR_BLOCKED=$(-not $survived)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Positive control - ioavtest (proves the cloud lookup works)
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'

          # Microsoft's block-at-first-sight test file; it carries no signature, so only a
          # live cloud lookup can convict it. This is the control that matters for !ml verdicts.
          $path = Join-Path $env:RUNNER_TEMP 'ioavtest.exe'
          try {
            Invoke-WebRequest -Uri 'https://aka.ms/ioavtest' -OutFile $path -UseBasicParsing
            Write-Host 'download call returned without error'
          }
          catch {
            Write-Host "download blocked: $($_.Exception.Message)"
          }

          Start-Sleep -Seconds 5
          $survived = Test-Path $path
          Write-Host "file still present: $survived"

          if ($survived) {
            Write-Host 'RESULT: ioavtest survived - cloud-delivered protection is NOT convicting it'
            Remove-Item $path -Force -ErrorAction SilentlyContinue
          }
          else {
            Write-Host 'RESULT: ioavtest removed - cloud lookup is live'
          }

          "IOAV_BLOCKED=$(-not $survived)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Threat history
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host '=== Get-MpThreatDetection ==='
          Get-MpThreatDetection | Select-Object InitialDetectionTime, ThreatID, Resources |
                                  Format-List

          Write-Host '=== Get-MpThreat ==='
          Get-MpThreat | Select-Object ThreatName, SeverityID, DetectionSource | Format-List

      - name: Verdict
        shell: powershell
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'

          $rtp   = $env:RTP_ENABLED   -eq 'True'
          $eicar = $env:EICAR_BLOCKED -eq 'True'
          $ioav  = $env:IOAV_BLOCKED  -eq 'True'
          $maps  = $env:MAPS_EXIT

          # RTP is only believable if the EICAR control actually disappeared
          $rtpLive = $rtp -and $eicar

          if     ($rtpLive -and $ioav) { $verdict = 'RTP on AND ioavtest blocked -> Phase 2 probe is meaningful; build it.' }
          elseif ($rtpLive)            { $verdict = 'RTP on, ioavtest NOT blocked -> local signature scan only. Keep the probe but label it partial; it will not catch !ml verdicts.' }
          else                         { $verdict = 'RTP off / Defender neutered -> drop the CI probe. Fall back to a manual pre-announce check on a clean Windows box.' }

          $lines = @(
            '## Defender probe results',
            '',
            '| Check | Result |',
            '| --- | --- |',
            "| RealTimeProtectionEnabled | $($env:RTP_ENABLED) |",
            "| EICAR removed | $($env:EICAR_BLOCKED) |",
            "| ioavtest removed | $($env:IOAV_BLOCKED) |",
            "| MpCmdRun -ValidateMapsConnection exit code | $maps |",
            '',
            "**Verdict:** $verdict"
          )

          $lines | ForEach-Object { Write-Host $_ }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
