name: Build and Release

on:
  # no tag trigger: the version comes from Directory.Build.props, so a pushed tag would be
  # ignored and the run would rebuild whatever version the props file names - overwriting an
  # already published release of that version. Release by running this workflow.
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Directory.Build.props is the only place the version is maintained. MSBuild applies it
      # to the assemblies by itself, so nothing here patches SkyRoof.csproj any more.
      - name: Read version from Directory.Build.props
        id: get_version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $xml = [xml](Get-Content Directory.Build.props -Raw)
          $version = "$($xml.Project.PropertyGroup.Version)".Trim()
          if ($version -notmatch '^\d+\.\d+$') { throw "version '$version' is not MAJOR.MINOR" }
          Write-Host "version: $version"
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      - name: Restore NuGet packages
        run: nuget restore SkyRoof.sln

      - name: Build WinForms App
        run: msbuild SkyRoof.sln /p:Configuration=Release /p:Platform=x64

      - name: Install Inno Setup
        run: choco upgrade innosetup --yes --no-progress
        shell: powershell

      - name: Patch .iss file with version
        run: |
          $version = "${{ steps.get_version.outputs.version }}"
          $issFile = 'install\SkyRoof.iss'
          (Get-Content $issFile) -replace '#define MyAppVersion ".*?"', "#define MyAppVersion `"$version`"" | Set-Content $issFile
        shell: pwsh

      - name: Package with Inno Setup
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "install\SkyRoof.iss"'
        shell: cmd

      - name: Upload Unsigned Artifact
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with: 
          path: 'install\Output\SkyRoofSetup.exe'

      - name: Sign
        uses: signpath/github-action-submit-signing-request@v1.1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          organization-id: '3bf60771-cf88-4c93-81c6-6cc8896015c3'
          project-slug: 'SkyRoof'
          signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: install

      # the installer ships as a bare .exe on purpose. Zipping it hides the Authenticode
      # signature from Defender and SmartScreen at download time, and an executable inside
      # an archive is itself a trait the ML models weigh. Do not add the .zip back, and do
      # not offer both.
      - name: Copy Installer
        run: |
          $version = "${{ steps.get_version.outputs.version }}"
          $versionedName = "SkyRoofSetup-v.$version"

          Copy-Item install\SkyRoofSetup.exe -Destination "install\$versionedName.exe"
          Get-ChildItem -Path install\*.* -recurse
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SkyRoof v.${{ steps.get_version.outputs.version }}
          tag_name: v.${{ steps.get_version.outputs.version }}
          body: See [Version History](https://ve3nea.github.io/SkyRoof/download.html).
          # body: This is an experimental build, please ignore.
          files:  install/SkyRoofSetup-v.${{ steps.get_version.outputs.version }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
